<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在</title>
<style>
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    background:#0b0d10;color:#e8edf2;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    text-align:center;padding:24px;
  }
  h1{font-size:56px;margin:0;letter-spacing:-.03em}
  p{color:#8b98a5;font-size:14px;margin:12px 0 28px}
  a{
    display:inline-block;background:#4c8dff;color:#fff;
    padding:11px 22px;border-radius:8px;text-decoration:none;font-size:14px;
  }
</style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>这个页面不存在，可能项目路径写错了。</p>
    <a id="home" href="./">回到合集首页</a>
  </div>
  <script>
    // 404 的 URL 保留的是用户请求的原路径，相对链接会跟着漂。
    // 这里统一算一次站点根：命中 /projects/ 就截断到它前面，
    // 从而兼容 Cloudflare 的根路径部署和 GitHub Pages 的 /仓库名/ 前缀。
    (function () {
      var p = location.pathname;
      var i = p.indexOf('/projects/');
      if (i > -1) document.getElementById('home').href = p.slice(0, i + 1);
    })();
  </script>
</body>
</html>
