
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCX 2 TXT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
    </script>
    <style>
        :root {
            --primary: #4f6ef7;
            --primary-dark: #3a56d4;
            --bg: #f0f2f7;
            --card-bg: #ffffff;
            --text: #2d3748;
            --text-light: #718096;
            --border: #e2e8f0;
            --success: #48bb78;
            --error: #fc8181;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(ellipse at 10% 20%, rgba(79,110,247,0.06) 0%, transparent 50%),
                              radial-gradient(ellipse at 90% 80%, rgba(79,110,247,0.08) 0%, transparent 50%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: var(--text);
        }
        .container { width: 100%; max-width: 860px; background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
        .header { background: linear-gradient(135deg, #4f6ef7 0%, #6a3de8 50%, #9f3de8 100%); padding: 32px 40px 28px; color: white; position: relative; overflow: hidden; }
        .header::before { content: ''; position: absolute; top: -60px; right: -40px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.08); }
        .header::after { content: ''; position: absolute; bottom: -80px; left: 30%; width: 260px; height: 160px; border-radius: 50%; background: rgba(255,255,255,0.05); }
        .header-content { position: relative; z-index: 1; }
        .header-icon { font-size: 40px; margin-bottom: 12px; display: inline-block; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
        .header p { font-size: 14px; opacity: 0.85; }
        .main { padding: 32px 40px 36px; }
        .upload-zone { border: 2.5px dashed #cbd5e0; border-radius: var(--radius); padding: 48px 30px; text-align: center; cursor: pointer; transition: all var(--transition); background: #fafbfe; }
        .upload-zone:hover { border-color: var(--primary); background: #f5f7ff; box-shadow: inset 0 0 0 1px var(--primary); }
        .upload-zone.dragover { border-color: var(--primary); background: #eef1ff; transform: scale(1.005); }
        .upload-zone.has-file { border-color: var(--success); background: #f0fdf4; }
        .upload-icon { font-size: 56px; margin-bottom: 16px; display: inline-block; transition: transform var(--transition); }
        .upload-zone:hover .upload-icon { transform: scale(1.1) rotate(-5deg); }
        .upload-text { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .upload-hint { font-size: 14px; color: var(--text-light); }
        .upload-hint strong { color: var(--primary); }
        .file-input { display: none; }
        .file-info { display: none; align-items: center; gap: 14px; background: #f7fafc; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 18px; margin-top: 16px; animation: slideUp 0.3s ease; }
        .file-info.show { display: flex; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .file-icon { font-size: 32px; }
        .file-details { flex: 1; min-width: 0; }
        .file-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-size { font-size: 13px; color: var(--text-light); }
        .file-remove { background: none; border: none; font-size: 20px; cursor: pointer; color: #a0aec0; padding: 6px; border-radius: 6px; }
        .file-remove:hover { background: #fee2e2; color: #e53e3e; }
        .actions { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
        .btn { padding: 12px 24px; border-radius: var(--radius-sm); border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: all var(--transition); display: inline-flex; align-items: center; gap: 8px; }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 14px rgba(79,110,247,0.35); }
        .btn-primary:hover { background: var(--primary-dark); box-shadow: 0 6px 20px rgba(79,110,247,0.45); }
        .btn-primary:disabled { background: #a0aec0; cursor: not-allowed; box-shadow: none; }
        .btn-secondary { background: #edf2f7; color: var(--text); }
        .btn-secondary:hover { background: #e2e8f0; }
        .btn-secondary:disabled { background: #e2e8f0; color: #a0aec0; cursor: not-allowed; }
        .btn-success { background: var(--success); color: white; box-shadow: 0 4px 14px rgba(72,187,120,0.35); }
        .btn-success:hover { background: #38a169; }
        .btn-success:disabled { background: #a0aec0; cursor: not-allowed; box-shadow: none; }
        .loading { display: none; align-items: center; gap: 12px; padding: 14px 18px; background: #ebf4ff; border-radius: var(--radius-sm); margin-top: 16px; }
        .loading.show { display: flex; }
        .spinner { width: 22px; height: 22px; border: 3px solid #c3d9fe; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 14px; color: var(--primary-dark); font-weight: 500; }
        .result-section { display: none; margin-top: 24px; animation: slideUp 0.4s ease; }
        .result-section.show { display: block; }
        .result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
        .result-title { font-size: 17px; font-weight: 700; }
        .char-count { font-size: 13px; color: var(--text-light); background: #f7fafc; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); }
        .text-output { width: 100%; min-height: 280px; max-height: 420px; padding: 18px 20px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; line-height: 1.7; font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Courier New', monospace; background: #fafbfe; resize: vertical; white-space: pre-wrap; word-wrap: break-word; overflow-y: auto; }
        .text-output:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,110,247,0.15); background: #fff; }
        .toast { position: fixed; top: 24px; right: 24px; padding: 14px 22px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; color: white; box-shadow: 0 8px 30px rgba(0,0,0,0.2); z-index: 999; animation: toastIn 0.4s cubic-bezier(0.21,1.02,0.73,1); display: flex; align-items: center; gap: 10px; max-width: 380px; }
        .toast.hide { animation: toastOut 0.3s ease forwards; }
        .toast-error { background: #e53e3e; }
        .toast-success { background: #38a169; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(60px); } }
        @media (max-width: 640px) {
            .header { padding: 22px 20px 20px; } .header h1 { font-size: 20px; } .main { padding: 20px 16px 24px; }
            .upload-zone { padding: 32px 16px; } .upload-icon { font-size: 42px; } .upload-text { font-size: 15px; }
            .btn { padding: 10px 16px; font-size: 13px; } .actions { gap: 8px; } .text-output { min-height: 200px; max-height: 320px; font-size: 12px; padding: 14px; }
            .toast { top: 12px; right: 12px; left: 12px; max-width: none; font-size: 13px; }
        }
        @media (max-width: 380px) { .actions { flex-direction: column; } .btn { justify-content: center; width: 100%; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <span class="header-icon">📄</span>
                <h1>DOCX 文字提取器</h1>
                <p>上传 Word 文档，一键提取纯文本内容（保留换行）</p>
            </div>
        </div>
        <div class="main">
            <div class="upload-zone" id="uploadZone">
                <span class="upload-icon">📤</span>
                <div class="upload-text">拖拽 .docx 文件到这里</div>
                <div class="upload-hint">或 <strong>点击浏览</strong> 选择文件</div>
                <input type="file" class="file-input" id="fileInput" accept=".docx" />
            </div>
            <div class="file-info" id="fileInfo">
                <span class="file-icon">📃</span>
                <div class="file-details">
                    <div class="file-name" id="fileName"></div>
                    <div class="file-size" id="fileSize"></div>
                </div>
                <button class="file-remove" id="removeFile" title="移除文件">✕</button>
            </div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <span class="loading-text">正在解析文档，请稍候…</span>
            </div>
            <div class="actions">
                <button class="btn btn-primary" id="extractBtn" disabled>🔍 提取文字</button>
                <button class="btn btn-success" id="downloadBtn" disabled>💾 下载 TXT</button>
                <button class="btn btn-secondary" id="copyBtn" disabled>📋 复制全部</button>
                <button class="btn btn-secondary" id="clearBtn" disabled>🗑️ 清空</button>
            </div>
            <div class="result-section" id="resultSection">
                <div class="result-header">
                    <span class="result-title">📝 提取结果</span>
                    <span class="char-count" id="charCount">0 字符</span>
                </div>
                <textarea class="text-output" id="textOutput" placeholder="提取的文字将显示在这里..." readonly></textarea>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const uploadZone = document.getElementById('uploadZone');
            const fileInput = document.getElementById('fileInput');
            const fileInfo = document.getElementById('fileInfo');
            const fileName = document.getElementById('fileName');
            const fileSize = document.getElementById('fileSize');
            const removeFileBtn = document.getElementById('removeFile');
            const extractBtn = document.getElementById('extractBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const copyBtn = document.getElementById('copyBtn');
            const clearBtn = document.getElementById('clearBtn');
            const loading = document.getElementById('loading');
            const resultSection = document.getElementById('resultSection');
            const textOutput = document.getElementById('textOutput');
            const charCount = document.getElementById('charCount');

            let selectedFile = null;
            let extractedText = '';

            function formatFileSize(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            function showToast(message, type = 'success') {
                const oldToast = document.querySelector('.toast');
                if (oldToast) oldToast.remove();
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.innerHTML = `${type === 'success' ? '✅' : '❌'} ${message}`;
                document.body.appendChild(toast);
                setTimeout(() => {
                    toast.classList.add('hide');
                    setTimeout(() => toast.remove(), 300);
                }, 2500);
            }

            function updateUI() {
                const hasFile = selectedFile !== null;
                const hasText = extractedText.length > 0;
                if (hasFile) {
                    fileInfo.classList.add('show');
                    uploadZone.classList.add('has-file');
                    fileName.textContent = selectedFile.name;
                    fileSize.textContent = formatFileSize(selectedFile.size);
                } else {
                    fileInfo.classList.remove('show');
                    uploadZone.classList.remove('has-file');
                }
                extractBtn.disabled = !hasFile;
                downloadBtn.disabled = !hasText;
                copyBtn.disabled = !hasText;
                clearBtn.disabled = !hasFile && !hasText;
                if (hasText) {
                    resultSection.classList.add('show');
                    textOutput.value = extractedText;
                    charCount.textContent = extractedText.length + ' 字符';
                } else {
                    resultSection.classList.remove('show');
                    textOutput.value = '';
                    charCount.textContent = '0 字符';
                }
            }

            function handleFile(file) {
                if (!file) return;
                if (!file.name.toLowerCase().endsWith('.docx')) {
                    showToast('请上传 .docx 格式的 Word 文档', 'error');
                    return;
                }
                selectedFile = file;
                extractedText = '';
                updateUI();
                showToast(`已选择文件：${file.name}`);
            }

            uploadZone.addEventListener('click', (e) => {
                if (e.target.closest('.file-input')) return;
                fileInput.click();
            });
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) handleFile(e.target.files[0]);
                fileInput.value = '';
            });
            uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
            uploadZone.addEventListener('dragleave', (e) => { e.preventDefault(); uploadZone.classList.remove('dragover'); });
            uploadZone.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadZone.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
            });
            removeFileBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                selectedFile = null;
                extractedText = '';
                updateUI();
                showToast('已移除文件');
            });

            // 核心提取逻辑（修复版）
            extractBtn.addEventListener('click', async () => {
                if (!selectedFile) return;
                loading.classList.add('show');
                extractBtn.disabled = true;

                try {
                    const arrayBuffer = await selectedFile.arrayBuffer();
                    const zip = await JSZip.loadAsync(arrayBuffer);
                    const docFile = zip.file('word/document.xml');
                    if (!docFile) throw new Error('未找到 document.xml，文件可能已损坏');

                    const xmlString = await docFile.async('string');
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlString, 'application/xml');
                    if (xmlDoc.querySelector('parsererror')) throw new Error('XML 解析失败，文档格式可能不正确');

                    // 获取所有段落
                    const paragraphs = xmlDoc.getElementsByTagName('w:p');
                    const lines = [];

                    for (let i = 0; i < paragraphs.length; i++) {
                        const paragraph = paragraphs[i];
                        // 获取段落内所有元素（按文档顺序）
                        const allElements = paragraph.getElementsByTagName('*');
                        let lineText = '';
                        for (let j = 0; j < allElements.length; j++) {
                            const node = allElements[j];
                            const name = node.nodeName;
                            if (name === 'w:t') {
                                lineText += node.textContent;
                            } else if (name === 'w:br' || name === 'w:cr') {
                                lineText += '\n';  // 手动换行
                            } else if (name === 'w:tab') {
                                lineText += '\t';  // 制表符
                            }
                        }
                        lines.push(lineText);
                    }

                    extractedText = lines.join('\n');  // 段落之间换行
                    extractedText = extractedText.replace(/\n{4,}/g, '\n\n\n'); // 压缩过多空行
                    extractedText = extractedText.trim();

                    loading.classList.remove('show');
                    updateUI();
                    showToast(`✅ 成功提取 ${extractedText.length} 个字符`);
                } catch (err) {
                    loading.classList.remove('show');
                    extractBtn.disabled = false;
                    showToast('解析失败：' + err.message, 'error');
                    console.error(err);
                }
            });

            downloadBtn.addEventListener('click', () => {
                if (!extractedText) return;
                const blob = new Blob([extractedText], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const baseName = selectedFile ? selectedFile.name.replace(/\.docx$/i, '') : 'extracted';
                a.download = baseName + '.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('✅ TXT 文件已下载');
            });

            copyBtn.addEventListener('click', async () => {
                if (!extractedText) return;
                try {
                    await navigator.clipboard.writeText(extractedText);
                    showToast('✅ 已复制到剪贴板');
                } catch (err) {
                    textOutput.removeAttribute('readonly');
                    textOutput.select();
                    document.execCommand('copy');
                    textOutput.setAttribute('readonly', true);
                    window.getSelection().removeAllRanges();
                    showToast('✅ 已复制到剪贴板');
                }
            });

            clearBtn.addEventListener('click', () => {
                selectedFile = null;
                extractedText = '';
                updateUI();
                showToast('已清空所有内容');
            });

            updateUI();

            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    if (!extractBtn.disabled) extractBtn.click();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    if (!downloadBtn.disabled) downloadBtn.click();
                }
            });
        })();
    </script>
</body>
</html>
