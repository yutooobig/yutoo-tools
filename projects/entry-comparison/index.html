            function openSimilarity() {
                if (allImages.length < 2) { showToast('至少需要2张图片', 'error'); return; }
                similarityOverlay.classList.add('active');
                renderSimilarityResults();
            }

            function closeSimilarity() { similarityOverlay.classList.remove('active'); }

            function renderSimilarityResults(forceCalc = false) {
                const threshold = parseFloat(thresholdSlider.value);
                const excludeCommon = excludeCommonCheckbox.checked;

                // 判断是否需要重新进行耗时计算
                if (forceCalc || cachedSimilarityResults === null || lastExcludeCommonState !== excludeCommon || lastImageCount !== allImages.length) {
                    similarityResults.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-secondary);font-size:13px;"><i class="fa-solid fa-spinner fa-spin" style="font-size:30px;opacity:0.4;display:block;margin-bottom:10px;"></i>正在努力比对中...</div>';

                    // 使用 setTimeout 避免卡死 UI
                    setTimeout(() => {
                        cachedSimilarityResults = calculateSimilaritiesOptimized(allImages, excludeCommon, 0.5);
                        lastExcludeCommonState = excludeCommon;
                        lastImageCount = allImages.length;
                        displaySimilarityDOM(threshold);
                    }, 10);
                } else {
                    // 仅拖动滑块时，只走轻量级过滤渲染
                    displaySimilarityDOM(threshold);
                }
            }

            function displaySimilarityDOM(threshold) {
                const results = cachedSimilarityResults.filter(r => r.similarity >= threshold);

                if (results.length === 0) {
                    similarityResults.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-secondary);font-size:13px;"><i class="fa-solid fa-check-circle" style="font-size:30px;opacity:0.4;display:block;margin-bottom:10px;"></i>没有找到超过阈值的相似图片对</div>';
                    return;
                }

                similarityResults.innerHTML = '';

                // 性能保护：防止由于低阈值导致插入数万个节点崩溃，最多渲染 150 条
                const displayLimit = 150;
                const slicedResults = results.slice(0, displayLimit);

                slicedResults.forEach(result => {
                    const pair = document.createElement('div');
                    pair.className = 'sim-pair';
                    const isHigh = result.similarity >= 0.6;
                    const imgA = result.imgA, imgB = result.imgB;
                    const sameTokenSet = imgA.promptTokens.length === imgB.promptTokens.length && imgA.promptTokens.every(t => imgB.promptTokens.includes(t)) && imgA.negativeTokens.length === imgB.negativeTokens.length && imgA.negativeTokens.every(t => imgB.negativeTokens.includes(t));
                    let hasWeightDiff = false;
                    if (sameTokenSet) {
                        const wa = { ...(imgA.promptWeights || {}), ...(imgA.negativeWeights || {}) };
                        const wb = { ...(imgB.promptWeights || {}), ...(imgB.negativeWeights || {}) };
                        const allToks = new Set([...Object.keys(wa), ...Object.keys(wb)]);
                        allToks.forEach(tok => { if (Math.abs((wa[tok] ?? 1.0) - (wb[tok] ?? 1.0)) > 0.001) hasWeightDiff = true; });
                    }
                    pair.innerHTML = `
                        <div class="sim-thumbs"><img src="${imgA.thumbnailDataURL}" data-id="${imgA.id}" title="${imgA.name}"><img src="${imgB.thumbnailDataURL}" data-id="${imgB.id}" title="${imgB.name}"></div>
                        <div class="sim-info"><div class="sim-score ${isHigh ? 'high' : ''}"><i class="fa-solid ${isHigh ? 'fa-triangle-exclamation' : 'fa-chart-line'}"></i> 相似度: ${(result.similarity * 100).toFixed(1)}%</div><div class="sim-common-tokens">共同词条: ${result.commonTokens.slice(0,8).join(', ')}${result.commonTokens.length > 8 ? '...' : ''}</div></div>
                        <div class="sim-actions">
                            <button class="sim-action-btn diff-btn" data-a="${imgA.id}" data-b="${imgB.id}"><i class="fa-solid fa-code-compare"></i> 差异</button>
                            ${hasWeightDiff ? `<button class="sim-action-btn weight-diff-btn" data-a="${imgA.id}" data-b="${imgB.id}"><i class="fa-solid fa-weight-scale"></i> 权重差异</button>` : ''}
                            <button class="sim-action-btn delete" data-id="${imgA.id}"><i class="fa-solid fa-trash"></i> 左</button>
                            <button class="sim-action-btn delete" data-id="${imgB.id}"><i class="fa-solid fa-trash"></i> 右</button>
                        </div>
                    `;
                    pair.querySelector('.diff-btn').addEventListener('click', () => { const a = allImages.find(i => i.id === imgA.id); const b = allImages.find(i => i.id === imgB.id); if (a && b) openDiffModal(a, b); });
                    if (hasWeightDiff) pair.querySelector('.weight-diff-btn').addEventListener('click', () => { const a = allImages.find(i => i.id === imgA.id); const b = allImages.find(i => i.id === imgB.id); if (a && b) openWeightDiffModal(a, b); });
                    pair.querySelectorAll('.sim-thumbs img').forEach(el => el.addEventListener('click', () => openDetail(el.dataset.id)));
                    pair.querySelectorAll('.sim-action-btn.delete').forEach(btn => btn.addEventListener('click', () => {
                        deleteImage(btn.dataset.id);
                        // 删除后清除缓存并重算
                        cachedSimilarityResults = null;
                        setTimeout(() => renderSimilarityResults(true), 300);
                    }));
                    similarityResults.appendChild(pair);
                });

                // 底部提示信息
                if (results.length > displayLimit) {
                    const info = document.createElement('div');
                    info.style.cssText = "text-align:center;font-size:11px;color:var(--text-secondary);padding:10px;";
                    info.innerText = `为保证流畅，仅显示前 ${displayLimit} 条结果 (共 ${results.length} 条)`;
                    similarityResults.appendChild(info);
                }
            }

            function toggleSelectionMode() {
                selectionMode = !selectionMode;

            function downloadBlob(blob, filename) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }

            async function downloadSelected(withMeta) {
                if (selectedIds.size === 0) { showToast('请先选择图片', 'error'); return; }
                const images = allImages.filter(img => selectedIds.has(img.id));
                for (const img of images) {
                    try {
                        if (withMeta) downloadBlob(img.fileBlob, img.name);
                        else {
                            if (img.fileBlob.type === 'image/png') {
                                const noMetaBlob = await removePNGMetadata(img.fileBlob);
                                downloadBlob(noMetaBlob, img.name);
                            } else downloadBlob(img.fileBlob, img.name);
                        }
                    } catch (e) { showToast(`下载 ${img.name} 失败`, 'error'); }
                }
                showToast(`已开始下载 ${images.length} 张图片`, 'success');
            }

            // ==================== 删除重复图片 ====================
            async function deleteDuplicateImages() {
                const groups = new Map();
                allImages.forEach(img => {
                    const key = JSON.stringify({ p: img.prompt, n: img.negativePrompt, seed: img.seed, steps: img.steps, sampler: img.sampler, scale: img.scale });
                    if (!groups.has(key)) groups.set(key, []);
                    groups.get(key).push(img);
                });
                let deleteCount = 0;
                groups.forEach(imgs => { if (imgs.length > 1) deleteCount += imgs.length - 1; });
                if (deleteCount === 0) { showToast('没有发现重复元数据图片', 'info'); return; }
                if (!confirm(`发现 ${deleteCount} 张重复图片，将删除重复项（保留每组最早一张），确定？`)) return;
                let deleted = 0;
                for (const imgs of groups.values()) {
                    if (imgs.length > 1) {
                        imgs.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                        for (const img of imgs.slice(1)) {
                            try { await dbDeleteImage(img.id); deleted++; } catch (e) { console.error(e); }
                        }
                    }
                }
                showToast(`已删除 ${deleted} 张重复图片`, 'success');

                        // ==================== 备份与恢复 ====================
            function blobToBase64(blob) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            }

            function base64ToBlob(base64, type) {
                const parts = base64.split(';base64,');
                const contentType = parts[0].split(':')[1] || type;
                const raw = window.atob(parts[1]);
                const rawLength = raw.length;
                const uInt8Array = new Uint8Array(rawLength);
                for (let i = 0; i < rawLength; ++i) uInt8Array[i] = raw.charCodeAt(i);
                return new Blob([uInt8Array], { type: contentType });
            }

async function exportBackup() {
    try {
        showToast('正在生成备份文件，可能需要一些时间，请稍候...', 'info');
        const allData = await dbGetAllImages();
        const exportData = [];
        for (const img of allData) {
            const imgCopy = { ...img };
            if (img.fileBlob) {
                imgCopy.fileBase64 = await blobToBase64(img.fileBlob);
                imgCopy.fileType = img.fileBlob.type;
                delete imgCopy.fileBlob;
            }
            exportData.push(imgCopy);
        }

        const backupObj = {
            images: exportData,
            localStorage: {
                customLabels: loadCustomLabels(),
                tokenLabels: loadTokenLabels(),
                blockedTokens: loadBlockedTokens(),
                tokenTranslations: loadTranslations(),
                showTranslation: showTranslation
            },
            version: 2, // 版本号，用于区分是否压缩
            compressed: true
        };

        const jsonStr = JSON.stringify(backupObj);
        const jsonBytes = new TextEncoder().encode(jsonStr);
        
        // 使用 pako 进行 gzip 压缩
        const compressedBytes = pako.gzip(jsonBytes);
        const blob = new Blob([compressedBytes], { type: 'application/octet-stream' });
        
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `NAI_Gallery_Backup_${new Date().toISOString().replace(/[:.]/g, '-')}.json.gz`;
        a.click();
        URL.revokeObjectURL(url);
        
        const originalSize = (jsonBytes.length / 1024 / 1024).toFixed(1);
        const compressedSize = (compressedBytes.length / 1024 / 1024).toFixed(1);
        showToast(`备份成功！${originalSize}MB → ${compressedSize}MB (压缩率 ${Math.round((1 - compressedBytes.length / jsonBytes.length) * 100)}%)`, 'success');
    } catch (e) {
        console.error(e);
        showToast('备份导出失败: ' + e.message, 'error');
    }
}

async function importBackup(file) {
    try {
        showToast('正在恢复备份数据，请勿关闭页面...', 'info');
        const arrayBuffer = await file.arrayBuffer();
        const bytes = new Uint8Array(arrayBuffer);

        let jsonStr;

        // 检测是否为 gzip 压缩格式 (magic number: 1F 8B)
        if (bytes.length >= 2 && bytes[0] === 0x1F && bytes[1] === 0x8B) {
            // 是 gzip 压缩文件，解压
            const decompressed = pako.ungzip(bytes);
            jsonStr = new TextDecoder().decode(decompressed);
        } else {
            // 兼容旧版未压缩的 JSON 备份
            jsonStr = new TextDecoder().decode(bytes);
        }

        const backupObj = JSON.parse(jsonStr);

        // 恢复 localStorage 数据
        if (backupObj.localStorage) {
            if (backupObj.localStorage.customLabels) saveCustomLabels(backupObj.localStorage.customLabels);
            if (backupObj.localStorage.tokenLabels) saveTokenLabels(backupObj.localStorage.tokenLabels);
            if (backupObj.localStorage.blockedTokens) saveBlockedTokens(backupObj.localStorage.blockedTokens);
            if (backupObj.localStorage.tokenTranslations) saveTranslations(backupObj.localStorage.tokenTranslations);
            if (backupObj.localStorage.showTranslation !== undefined) {
                showTranslation = backupObj.localStorage.showTranslation;
                localStorage.setItem(LS_SHOW_TRANSLATION, showTranslation);
            }
        }

        // 恢复 IndexedDB 数据库
        if (backupObj.images && backupObj.images.length > 0) {
            const oldImages = await dbGetAllImages();
            for (const img of oldImages) await dbDeleteImage(img.id);

            for (const img of backupObj.images) {
                if (img.fileBase64) {
                    const blob = base64ToBlob(img.fileBase64, img.fileType || 'image/png');
                    img.fileBlob = new File([blob], img.name || 'image.png', { type: img.fileType || 'image/png' });
                    delete img.fileBase64;
                    delete img.fileType;
                }
                await dbAddImage(img);
            }
        }

        await loadAllImages();
        showToast('备份数据恢复成功！', 'success');
    } catch (e) {
        console.error(e);
        showToast('备份恢复失败，文件可能已损坏或格式不正确: ' + e.message, 'error');
    }
}
