<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e2a3a">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.min.js"></script>

    <title>NAI 提示词管理器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg: #f5f6fa; --card-bg: #ffffff; --sidebar-bg: #1e2a3a; --sidebar-text: #e0e6ed; --primary: #4a6cf7; --primary-hover: #3b5de7; --danger: #e74c3c; --danger-hover: #c0392b; --success: #27ae60; --warning: #f39c12; --text: #2c3e50; --text-secondary: #7f8c8d; --border: #e1e5eb; --shadow: 0 2px 12px rgba(0,0,0,0.08); --shadow-lg: 0 8px 30px rgba(0,0,0,0.15); --radius: 12px; --radius-sm: 8px; --radius-xs: 5px; --transition: 0.25s cubic-bezier(0.4,0,0.2,1); --font: 'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif; --header-height: 60px; --filter-height: 48px; --tag-color-bg: #eef1ff; --tag-color-text: #4a6cf7; --tag-color-border: #d5dcff; --safe-area-bottom: env(safe-area-inset-bottom, 0px);}
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; -webkit-tap-highlight-color:transparent; }
        ::-webkit-scrollbar { width:6px; height:6px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:#c0c4cc; border-radius:3px; }
        ::-webkit-scrollbar-thumb:hover { background:#a0a4ac; }
        .app-header { position:sticky; top:0; z-index:100; background:var(--sidebar-bg); color:var(--sidebar-text); height:var(--header-height); display:flex; align-items:center; justify-content:space-between; padding:0 16px; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
        .app-header .logo { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; letter-spacing:0.5px; white-space:nowrap; }
        .app-header .logo i { color:#6c8cff; font-size:22px; }
        .header-actions { display:flex; gap:8px; align-items:center; flex-wrap:nowrap; }
        .header-btn { background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:8px 14px; border-radius:var(--radius-sm); cursor:pointer; font-size:13px; font-weight:500; display:flex; align-items:center; gap:6px; transition:var(--transition); white-space:nowrap; font-family:var(--font); }
        .header-btn:hover { background:rgba(255,255,255,0.22); border-color:rgba(255,255,255,0.35); }
        .header-btn i { font-size:14px; }
        .header-btn.primary { background:var(--primary); border-color:var(--primary); }
        .header-btn.primary:hover { background:var(--primary-hover); border-color:var(--primary-hover); }
        .header-btn.danger { background:var(--danger); border-color:var(--danger); }
        .header-btn.danger:hover { background:var(--danger-hover); border-color:var(--danger-hover); }
        .total-size-display { display:flex; align-items:center; gap:4px; font-size:12px; color:#b0b8c4; background:rgba(255,255,255,0.08); padding:4px 10px; border-radius:20px; white-space:nowrap; user-select:none; }
        .total-size-display i { font-size:11px; }
        .total-size-display span { font-weight:600; }
        .filter-bar { position:sticky; top:var(--header-height); z-index:90; background:var(--card-bg); padding:8px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; flex-wrap:wrap; min-height:var(--filter-height); box-shadow:0 1px 4px rgba(0,0,0,0.04); }
        .filter-bar .filter-label { font-size:13px; color:var(--text-secondary); display:flex; align-items:center; gap:6px; font-weight:500; white-space:nowrap; }
        .filter-tags { display:flex; gap:6px; flex-wrap:wrap; align-items:center; flex:1; }
        .filter-tag { display:inline-flex; align-items:center; gap:5px; background:#eef1ff; color:var(--primary); padding:4px 10px; border-radius:20px; font-size:12px; font-weight:500; cursor:pointer; transition:var(--transition); border:1px solid #d5dcff; }
        .filter-tag:hover { background:#dfe5ff; }
        .filter-tag i { font-size:10px; cursor:pointer; opacity:0.7; }
        .filter-tag i:hover { opacity:1; }
        .clear-filter-btn { background:none; border:none; color:var(--text-secondary); cursor:pointer; font-size:12px; display:flex; align-items:center; gap:4px; padding:4px 8px; border-radius:var(--radius-xs); transition:var(--transition); font-family:var(--font); }
        .clear-filter-btn:hover { color:var(--danger); background:#fef0ef; }
        .download-actions { display:none; gap:6px; align-items:center; flex-wrap:wrap; }
        .download-actions.active { display:flex; }
        .download-actions .btn-sm { padding:5px 10px; font-size:11px; border-radius:6px; border:1px solid var(--border); background:#f8f9fa; cursor:pointer; transition:var(--transition); font-family:var(--font); color:var(--text); display:flex; align-items:center; gap:4px; }
        .download-actions .btn-sm:hover { background:#e9ecef; }
        .download-actions .btn-sm.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
        .download-actions .btn-sm.primary:hover { background:var(--primary-hover); }
        .download-actions .btn-sm.danger { background:var(--danger); color:#fff; border-color:var(--danger); }
        .download-actions .btn-sm.danger:hover { background:var(--danger-hover); }
        .weight-filter-bar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; width:100%; padding-top:6px; border-top:1px dashed var(--border); margin-top:6px; }
        .weight-filter-bar .weight-filter-label { font-size:12px; color:var(--text-secondary); font-weight:500; display:flex; align-items:center; gap:4px; white-space:nowrap; }
        .weight-filter-bar .weight-capsule { display:inline-flex; align-items:center; gap:4px; background:#f0f2f5; border-radius:20px; padding:4px 10px; font-size:12px; font-weight:500; border:1px solid #d0d5dd; cursor:pointer; transition:var(--transition); user-select:none; }
        .weight-filter-bar .weight-capsule:hover { background:#e0e5ff; border-color:var(--primary); }
        .weight-filter-bar .weight-capsule.active { background:var(--primary); color:#fff; border-color:var(--primary); }
        .weight-filter-bar .weight-capsule .weight-count { background:rgba(255,255,255,0.3); border-radius:10px; padding:0 5px; font-size:10px; font-weight:700; }
        .main-content { display:flex; min-height:calc(100vh - var(--header-height) - var(--filter-height)); }
        .gallery { flex:1; padding:16px; overflow-y:auto; }
        .gallery-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:14px; }
        .gallery-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:50vh; color:var(--text-secondary); gap:14px; text-align:center; padding:20px; }
        .gallery-empty i { font-size:60px; opacity:0.4; }
        .gallery-empty p { font-size:15px; max-width:320px; line-height:1.6; }
        .gallery-empty .upload-hint-btn { background:var(--primary); color:#fff; border:none; padding:10px 20px; border-radius:var(--radius-sm); cursor:pointer; font-size:14px; font-weight:500; transition:var(--transition); font-family:var(--font); display:flex; align-items:center; gap:8px; }
        .gallery-empty .upload-hint-btn:hover { background:var(--primary-hover); }
        .image-card { background:var(--card-bg); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); transition:var(--transition); cursor:pointer; position:relative; border:2px solid transparent; display:flex; flex-direction:column; }
        .image-card:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); }
        .image-card.selected { border-color:var(--primary); box-shadow:0 0 0 3px rgba(74,108,247,0.2); }
        .image-card .thumb-wrapper { position:relative; width:100%; aspect-ratio:1/1; overflow:hidden; background:#f0f0f0; flex-shrink:0; }
        .image-card .thumb-wrapper img { width:100%; height:100%; object-fit:cover; display:block; transition:transform 0.3s ease; }
        .image-card:hover .thumb-wrapper img { transform:scale(1.04); }
        .image-card .select-checkbox { position:absolute; top:8px; left:8px; width:20px; height:20px; accent-color:var(--primary); cursor:pointer; z-index:5; display:none; }
        .image-card .select-checkbox.show { display:block; }
        .image-card .card-info { padding:10px 12px; flex:1; display:flex; flex-direction:column; gap:4px; }
        .image-card .card-name { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .image-card .card-prompt-preview { font-size:11px; color:var(--text-secondary); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-all; }
        .image-card .card-actions { display:flex; gap:4px; padding:6px 8px; border-top:1px solid #f0f0f0; flex-shrink:0; }
        .card-action-btn { background:none; border:1px solid var(--border); border-radius:var(--radius-xs); padding:5px 8px; cursor:pointer; font-size:11px; color:var(--text-secondary); transition:var(--transition); display:flex; align-items:center; gap:3px; font-family:var(--font); flex:1; justify-content:center; }
        .card-action-btn:hover { background:#f5f6fa; color:var(--text); }
        .card-action-btn.copy-pos:hover { background:#eef7f0; color:var(--success); border-color:var(--success); }
        .card-action-btn.copy-neg:hover { background:#fdf0ef; color:var(--danger); border-color:var(--danger); }
        .card-action-btn.delete-btn:hover { background:#fdf0ef; color:var(--danger); border-color:var(--danger); }
        .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.55); z-index:550; display:none; align-items:center; justify-content:center; padding:16px; backdrop-filter:blur(3px); animation:fadeIn 0.2s ease; }

        .modal-overlay.active { display:flex; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        @keyframes slideUp { from { transform:translateY(30px); opacity:0; } to { transform:translateY(0); opacity:1; } }
        .modal-content { background:var(--card-bg); border-radius:var(--radius); max-width:720px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-lg); animation:slideUp 0.25s ease; display:flex; flex-direction:column; }
        .modal-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); flex-shrink:0; position:sticky; top:0; background:var(--card-bg); z-index:1; }
        .modal-header h3 { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:70%; }
        .modal-close-btn { background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-secondary); padding:4px 8px; border-radius:var(--radius-xs); transition:var(--transition); }
        .modal-close-btn:hover { background:#f0f0f0; color:var(--text); }
        .modal-body { padding:20px; display:flex; flex-direction:column; gap:16px; }
        .modal-image-container { width:100%; max-height:320px; display:flex; justify-content:center; background:#f8f9fa; border-radius:var(--radius-sm); overflow:hidden; }
        .modal-image-container img { max-width:100%; max-height:320px; object-fit:contain; }
        .modal-section { display:flex; flex-direction:column; gap:8px; }
        .modal-section .section-label { font-size:12px; font-weight:600; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.5px; display:flex; align-items:center; gap:6px; }
        .prompt-text { background:#f8f9fa; padding:12px; border-radius:var(--radius-sm); font-size:13px; line-height:1.6; word-break:break-all; max-height:180px; overflow-y:auto; white-space:pre-wrap; font-family:'Consolas','Monaco','Courier New',monospace; border:1px solid #e8e8e8; }
        .prompt-text.negative { border-left:3px solid var(--danger); }
        .prompt-text.positive { border-left:3px solid var(--success); }
        .copy-row { display:flex; gap:6px; flex-wrap:wrap; }
        .copy-btn { background:#f0f2f5; border:1px solid var(--border); padding:6px 12px; border-radius:var(--radius-xs); cursor:pointer; font-size:12px; display:flex; align-items:center; gap:5px; transition:var(--transition); font-family:var(--font); color:var(--text); }
        .copy-btn:hover { background:#e4e7eb; }
        .copy-btn.positive-btn:hover { background:#eef7f0; color:var(--success); border-color:var(--success); }
        .copy-btn.negative-btn:hover { background:#fdf0ef; color:var(--danger); border-color:var(--danger); }
        .params-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:8px; }
        .param-item { background:#f8f9fa; padding:8px 10px; border-radius:var(--radius-xs); font-size:12px; display:flex; flex-direction:column; gap:2px; border:1px solid #e8e8e8; }
        .param-item .param-key { font-weight:600; color:var(--text-secondary); font-size:10px; text-transform:uppercase; letter-spacing:0.3px; }
        .param-item .param-value { font-weight:500; word-break:break-all; }
        .token-sidebar { position:fixed; top:0; right:-520px; width:480px; max-width:95vw; height:100vh; background:var(--card-bg); box-shadow:-4px 0 20px rgba(0,0,0,0.15); z-index:300; transition:right 0.3s cubic-bezier(0.4,0,0.2,1); display:flex; flex-direction:column; }
        .token-sidebar.active { right:0; }
        .token-sidebar-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; background:var(--sidebar-bg); color:#fff; }
        .token-sidebar-header h3 { font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px; }
        .token-sidebar-close { background:none; border:none; color:#fff; font-size:20px; cursor:pointer; padding:4px 8px; border-radius:var(--radius-xs); transition:var(--transition); }
        .token-sidebar-close:hover { background:rgba(255,255,255,0.15); }
        .token-tabs { display:flex; gap:4px; padding:10px 16px; background:#f8f9fa; border-bottom:1px solid var(--border); flex-shrink:0; }
        .token-tab { padding:7px 16px; border-radius:20px; border:none; cursor:pointer; font-size:12px; font-weight:500; transition:var(--transition); font-family:var(--font); background:transparent; color:var(--text-secondary); }
        .token-tab.active { background:var(--primary); color:#fff; }
        .token-tab:hover:not(.active) { background:#e9ecf5; }
        .token-list { flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:6px; }
        .token-item { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; background:#f8f9fa; border-radius:var(--radius-sm); cursor:pointer; transition:var(--transition); border:1px solid transparent; gap:8px; flex-wrap:wrap; }
        .token-item:hover { background:#eef1ff; border-color:#d5dcff; }
        .token-item .token-name { font-size:12px; font-weight:500; word-break:break-all; flex:1; line-height:1.3; cursor:pointer; min-width:60px; }
        .token-item .token-count { font-size:11px; color:var(--text-secondary); background:#e9ecef; padding:2px 8px; border-radius:10px; font-weight:600; flex-shrink:0; }
        .token-item .token-count.pos { background:#d4edda; color:#155724; }
        .token-item .token-count.neg { background:#f8d7da; color:#721c24; }
        .token-item .filter-token-btn { background:none; border:none; color:var(--text-secondary); cursor:pointer; font-size:12px; padding:4px; border-radius:4px; transition:var(--transition); flex-shrink:0; }
        .token-item .filter-token-btn:hover { color:var(--primary); background:#e0e5ff; }
        .token-item .tag-badge { display:inline-flex; align-items:center; font-size:10px; padding:1px 6px; border-radius:10px; font-weight:500; flex-shrink:0; cursor:pointer; transition:var(--transition); }
        .token-item .tag-badge:hover { opacity:0.8; }
        .token-item .tag-badge.more-tags { background:#f0f0f0; color:#888; cursor:default; }
        .token-item .token-checkbox { accent-color:var(--primary); width:16px; height:16px; cursor:pointer; flex-shrink:0; display:none; }
        .token-item .token-checkbox.show { display:block; }
        .token-item .token-action-btn { background:none; border:none; color:var(--text-secondary); cursor:pointer; font-size:12px; padding:4px; border-radius:4px; transition:var(--transition); flex-shrink:0; }
        .token-item .token-action-btn:hover { background:#e9ecef; }
        .token-item .token-action-btn.tag-btn:hover { color:var(--warning); background:#fff8e1; }
        .token-item .token-action-btn.block-btn:hover { color:var(--danger); background:#fdf0ef; }
        .token-item .token-action-btn.block-btn.blocked { color:var(--danger); background:#fdf0ef; }
        .token-item .token-action-btn.tag-btn.has-tag { color:var(--warning); }
        .token-item .token-action-btn.edit-trans-btn:hover { color:var(--primary); background:#e0e5ff; }
        .token-weight-bar { padding:8px 16px; border-bottom:1px solid var(--border); background:#fcfcfc; flex-shrink:0; }
        .token-weight-bar .weight-capsule { display:inline-flex; align-items:center; gap:4px; background:#f0f2f5; border-radius:20px; padding:6px 12px; font-size:13px; font-weight:500; border:1px solid #d0d5dd; cursor:pointer; transition:var(--transition); }
        .token-weight-bar .weight-capsule:hover { background:#e0e5ff; border-color:var(--primary); }
        .token-weight-bar .weight-capsule .weight-count { background:var(--primary); color:#fff; border-radius:10px; padding:2px 6px; font-size:10px; font-weight:700; }
        .token-search { padding:10px 16px; flex-shrink:0; position:relative; }
        .token-search input { width:100%; padding:8px 12px 8px 36px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:13px; font-family:var(--font); outline:none; transition:var(--transition); background:#f8f9fa; }
        .token-search input:focus { border-color:var(--primary); background:#fff; box-shadow:0 0 0 3px rgba(74,108,247,0.1); }
        .token-search i { position:absolute; left:26px; top:50%; transform:translateY(-50%); color:var(--text-secondary); font-size:13px; }
        .tag-filter-bar { display:flex; gap:6px; flex-wrap:nowrap; overflow-x:auto; padding:8px 12px; border-bottom:1px solid var(--border); flex-shrink:0; -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
        .tag-filter-bar::-webkit-scrollbar { height:3px; }
        .tag-filter-capsule { display:inline-flex; align-items:center; gap:5px; background:#f0f2f5; border-radius:20px; padding:4px 10px; font-size:11px; font-weight:500; border:1px solid #d0d5dd; cursor:pointer; transition:var(--transition); user-select:none; white-space:nowrap; flex-shrink:0; }
        .tag-filter-capsule:hover { background:#e0e5ff; border-color:var(--primary); }
        .tag-filter-capsule.active { background:var(--primary); color:#fff; border-color:var(--primary); }
        .tag-filter-capsule .tag-count { background:rgba(255,255,255,0.3); border-radius:10px; padding:0 5px; font-size:10px; font-weight:700; }
        .tag-filter-capsule.active .tag-count { background:rgba(255,255,255,0.3); }
        .token-toolbar { display:flex; gap:6px; padding:6px 12px; border-bottom:1px solid var(--border); flex-shrink:0; background:#fafbfc; flex-wrap:wrap; align-items:center; }
        .token-toolbar .toolbar-btn { padding:5px 10px; font-size:11px; border-radius:6px; border:1px solid var(--border); background:#fff; cursor:pointer; transition:var(--transition); font-family:var(--font); color:var(--text); display:flex; align-items:center; gap:4px; white-space:nowrap; }
        .token-toolbar .toolbar-btn:hover { background:#f0f2f5; }
        .token-toolbar .toolbar-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
        .token-toolbar .toolbar-btn.tag-manage-btn:hover { color:var(--warning); border-color:var(--warning); }
        .token-toolbar .toolbar-btn.ai-export-btn { color:#8e44ad; border-color:#d2b4de; }
        .token-toolbar .toolbar-btn.ai-export-btn:hover { background:#f4ecf7; }
        .token-toolbar .toolbar-btn.ai-import-btn { color:#27ae60; border-color:#a3e4d7; }
        .token-toolbar .toolbar-btn.ai-import-btn:hover { background:#e8f8f5; }
        .batch-action-bar { display:none; gap:6px; padding:8px 12px; border-top:1px solid var(--border); flex-shrink:0; background:#fafbfc; align-items:center; flex-wrap:wrap; }
        .batch-action-bar.active { display:flex; }
        .batch-action-bar .batch-btn { padding:5px 10px; font-size:11px; border-radius:6px; border:1px solid var(--border); background:#fff; cursor:pointer; transition:var(--transition); font-family:var(--font); color:var(--text); display:flex; align-items:center; gap:4px; }
        .batch-action-bar .batch-btn:hover { background:#f0f2f5; }
        .batch-action-bar .batch-btn.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
        .batch-action-bar .batch-btn.primary:hover { background:var(--primary-hover); }
        .batch-action-bar .batch-selected-count { font-size:12px; color:var(--text-secondary); font-weight:500; margin-left:auto; }
        .tag-selector-list { display:flex; flex-wrap:wrap; gap:8px; max-height:200px; overflow-y:auto; padding:4px; }
        .tag-selector-item { display:inline-flex; align-items:center; gap:5px; background:#f0f2f5; border-radius:16px; padding:5px 12px; font-size:12px; font-weight:500; border:2px solid transparent; cursor:pointer; transition:var(--transition); user-select:none; }
        .tag-selector-item:hover { background:#e0e5ff; }
        .tag-selector-item.selected { border-color:var(--primary); background:#eef1ff; color:var(--primary); }
        .tag-selector-item .tag-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

            function openDB() {
                return new Promise((resolve, reject) => {
                    if (db) { resolve(db); return; }
                    const req = indexedDB.open(DB_NAME, DB_VERSION);
                    req.onupgradeneeded = (e) => {
                        const database = e.target.result;
                        if (!database.objectStoreNames.contains(STORE_NAME)) {
                            const store = database.createObjectStore(STORE_NAME, { keyPath: 'id' });
                            store.createIndex('timestamp', 'timestamp', { unique: false });
                        }
                    };
                    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
                    req.onerror = (e) => reject(e.target.error);
                });
            }

                return new Promise((resolve, reject) => {
                    openDB().then((database) => {
                        const tx = database.transaction(STORE_NAME, 'readwrite');
                        const store = tx.objectStore(STORE_NAME);
                        store.put(imageData);
                        tx.oncomplete = () => resolve();
                        tx.onerror = (e) => reject(e.target.error);
                    }).catch(reject);
                });
            }

            function dbGetAllImages() {
                return new Promise((resolve, reject) => {

                        const req = index.getAll();
                        req.onsuccess = () => resolve(req.result || []);
                        req.onerror = (e) => reject(e.target.error);

            // ==================== PNG 元数据解析 ====================
            function parsePNGMetadata(arrayBuffer) {
                const bytes = new Uint8Array(arrayBuffer);
                if (bytes.length < 8) return null;
                const signature = [137, 80, 78, 71, 13, 10, 26, 10];
                for (let i = 0; i < 8; i++)
                    if (bytes[i] !== signature[i]) return null;
                let offset = 8;
                let metadata = null;
                while (offset < bytes.length) {
                    if (offset + 8 > bytes.length) break;
                    const length = (bytes[offset] << 24) | (bytes[offset + 1] << 16) | (bytes[offset + 2] << 8) | bytes[offset + 3];
                    const type = String.fromCharCode(bytes[offset + 4], bytes[offset + 5], bytes[offset + 6], bytes[offset + 7]);
                    const dataStart = offset + 8;
                    const dataEnd = dataStart + length;
                    if (dataEnd > bytes.length) break;
                    if (type === 'tEXt' || type === 'iTXt') {
                        const chunkData = bytes.slice(dataStart, dataEnd);
                        let keyword = '';
                        let textContent = '';
                        if (type === 'tEXt') {
                            let nullIdx = -1;
                            for (let i = 0; i < chunkData.length; i++)
                                if (chunkData[i] === 0) { nullIdx = i; break; }
                            if (nullIdx > -1) {
                                const keywordBytes = chunkData.slice(0, nullIdx);
                                keyword = new TextDecoder('latin1').decode(keywordBytes);
                                const textBytes = chunkData.slice(nullIdx + 1);
                                textContent = new TextDecoder('latin1').decode(textBytes);
                            }
                        } else {
                            let nullIdx1 = -1;
                            for (let i = 0; i < chunkData.length; i++)
                                if (chunkData[i] === 0) { nullIdx1 = i; break; }
                            if (nullIdx1 > -1) {
                                const keywordBytes = chunkData.slice(0, nullIdx1);
                                keyword = new TextDecoder('utf-8').decode(keywordBytes);
                                const restIdx = nullIdx1 + 1;
                                if (restIdx + 2 <= chunkData.length) {
                                    let nullIdx2 = -1;
                                    for (let i = restIdx + 2; i < chunkData.length; i++)
                                        if (chunkData[i] === 0) { nullIdx2 = i; break; }
                                    if (nullIdx2 > -1) {
                                        let nullIdx3 = -1;
                                        for (let i = nullIdx2 + 1; i < chunkData.length; i++)
                                            if (chunkData[i] === 0) { nullIdx3 = i; break; }
                                        const textStart = nullIdx3 > -1 ? nullIdx3 + 1 : nullIdx2 + 1;
                                        const textBytes = chunkData.slice(textStart);
                                        textContent = new TextDecoder('utf-8').decode(textBytes);
                                    }
                                }
                            }
                        }
                        if (keyword === 'Comment' || keyword === 'parameters' || keyword === 'prompt' || keyword === 'description') {
                            if (textContent && textContent.trim().startsWith('{')) {
                                try { metadata = JSON.parse(textContent); } catch (e) {
                                    const jsonMatch = textContent.match(/{[\s\S]*}/);
                                    if (jsonMatch) { try { metadata = JSON.parse(jsonMatch[0]); } catch (e2) { metadata = null; } }
                                }
                            }
                            if (metadata) break;
                        }
                    }
                    offset = dataEnd + 4;
                }
                return metadata;
            }

// ==================== 词条提取 ====================
function parseBrackets(rawToken) {
    let token = rawToken.trim();
    let multiplier = 1.0;
    let changed = true;
    while (changed) {
        changed = false;
        if (token.startsWith('{') && token.endsWith('}')) {
            multiplier *= 1.05;
            token = token.slice(1, -1).trim();
            changed = true;
        }
        if (token.startsWith('[') && token.endsWith(']')) {
            multiplier *= 1 / 1.05;
            token = token.slice(1, -1).trim();
            changed = true;
        }
    }
    return { token, multiplier };
}

function extractTokenData(promptStr) {
    if (!promptStr) return { tokens: [], weights: {} };
    let cleaned = promptStr;
    cleaned = cleaned.replace(/{{tar}}/g, '');
    const tokensSet = new Set();
    const weights = {};

    function processPlainToken(rawToken) {
        let token = rawToken.trim();
        if (!token) return null;
        const bracket = parseBrackets(token);
        token = bracket.token;
        let weight = bracket.multiplier;
        const suffixMatch = token.match(/(.+?):\s*(-?\d+(?:\.\d+)?)\s*$/);
        if (suffixMatch) {
            token = suffixMatch[1].trim();
            const w = parseFloat(suffixMatch[2]);
            if (!isNaN(w)) weight = w;
        }
        // 移除括号和尖括号等符号
        token = token.replace(/[()\[\]<>]/g, '');
        token = token.replace(/\s+/g, ' ').trim();
        
        if (/^\d+(\.\d+)?$/.test(token)) {
            // 纯数字词条，跳过
            return null;
        }
        // 过滤掉过短或过长的词条
        if (!token || token.length < 1 || token.length >= 200) return null;
        return { token, weight };
    }
    const weightBlocks = [];
    const blockRegex = /(-?\d+(?:\.\d+)?)\s*::\s*([\s\S]*?)\s*::/g;
    let match;
    let remainingStr = cleaned;
    while ((match = blockRegex.exec(cleaned)) !== null) {
        const blockWeight = parseFloat(match[1]);
        const blockContent = match[2];
        weightBlocks.push({ weight: blockWeight, content: blockContent });
        remainingStr = remainingStr.replace(match[0], '');
    }
    const parts = remainingStr.split(',');
    for (let part of parts) {
        const result = processPlainToken(part);
        if (result) {
            tokensSet.add(result.token);
            weights[result.token] = result.weight;
        }
    }
    for (const block of weightBlocks) {
        const blockWeight = block.weight;
        const blockTokens = block.content.split(',');
        for (let rawToken of blockTokens) {
            rawToken = rawToken.trim();
            if (!rawToken) continue;
            const bracket = parseBrackets(rawToken);
            let token = bracket.token;
            let weight = blockWeight * bracket.multiplier;
            token = token.replace(/[()\[\]<>]/g, '');
            token = token.replace(/\s+/g, ' ').trim();
            if (/^\d+(\.\d+)?$/.test(token)) {
                continue; // 纯数字跳过
            }
            if (!token || token.length < 1 || token.length >= 200) continue;
            tokensSet.add(token);
            weights[token] = weight;
        }
    }
    return { tokens: Array.from(tokensSet), weights };
}

            // ==================== 标签、屏蔽与翻译数据管理 (localStorage) ====================

            function getBlockedTokensForCopy() {

            function removeBlockedTokensFromPrompt(prompt, blockedTokens) {
                if (!prompt || blockedTokens.size === 0) return prompt;

                const weightBlockRegex = /(-?\d+(?:\.\d+)?)\s*::\s*([\s\S]*?)\s*::/g;
                let result = '';
                let lastIndex = 0;
                let match;

                const filterPlainPart = (text) => {
                    if (!text) return text;
                    const parts = text.split(',');
                    const filtered = parts.filter(part => {
                        const trimmed = part.trim();
                        if (!trimmed) return false;
                        const tokenData = extractTokenData(trimmed);
                        return !tokenData.tokens.some(t => blockedTokens.has(t));
                    });
                    return filtered.join(',');
                };

                const filterBlockContent = (content) => {
                    if (!content) return '';
                    const parts = content.split(',');
                    const filtered = parts.filter(part => {
                        const trimmed = part.trim();
                        if (!trimmed) return false;
                        const tokenData = extractTokenData(trimmed);
                        return !tokenData.tokens.some(t => blockedTokens.has(t));
                    });
                    return filtered.join(',');
                };

                while ((match = weightBlockRegex.exec(prompt)) !== null) {
                    const before = prompt.slice(lastIndex, match.index);
                    result += filterPlainPart(before);
                    const blockWeight = match[1];
                    const blockContent = match[2];
                    const filteredContent = filterBlockContent(blockContent);
                    if (filteredContent) {
                        result += `${blockWeight}::${filteredContent}::`;
                    }
                    lastIndex = weightBlockRegex.lastIndex;
                }

                const tail = prompt.slice(lastIndex);
                result += filterPlainPart(tail);
                result = result.replace(/,\s*,/g, ',').replace(/^,\s*/, '').replace(/,\s*$/, '').trim();
                return result;
            }

            // ==================== 相似度计算 ====================
            let cachedSimilarityResults = null;
            let lastExcludeCommonState = null;
            let lastImageCount = -1;

            function calculateSimilaritiesOptimized(images, excludeCommon, commonThreshold = 0.5) {
                const results = [];
                const n = images.length;
                if (n < 2) return results;

                // 1. 预先处理并过滤所有词条，避免在双重循环内重复计算
                const blockedDiff = getBlockedTokensForDiff();
                const tokenFrequencies = {};

                if (excludeCommon) {
                    images.forEach(img => {
                        const uniqueTokens = new Set(img.promptTokens.filter(t => !blockedDiff.has(t)));
                        uniqueTokens.forEach(t => tokenFrequencies[t] = (tokenFrequencies[t] || 0) + 1);
                    });
                }
                const freqThreshold = n * commonThreshold;

                const processedImages = images.map(img => {
                    let tokens = img.promptTokens.filter(t => !blockedDiff.has(t));
                    if (excludeCommon) tokens = tokens.filter(t => tokenFrequencies[t] <= freqThreshold);
                    return { img, tokens };
                });

                // 2. 双重循环仅作交集比对
                for (let i = 0; i < n; i++) {
                    const A = processedImages[i];
                    if (A.tokens.length === 0) continue;

                    for (let j = i + 1; j < n; j++) {
                        const B = processedImages[j];
                        if (B.tokens.length === 0) continue;

                        const intersection = A.tokens.filter(t => B.tokens.includes(t));
                        const unionSize = A.tokens.length + B.tokens.length - intersection.length;
                        if (unionSize === 0) continue;

                        const sim = intersection.length / unionSize;

                        // 为了性能，只保留相似度 > 0.1 的结果供后续滑块调整过滤
                        if (sim >= 0.1) {
                            results.push({ imgA: A.img, imgB: B.img, similarity: sim, commonTokens: intersection });
                        }
                    }
                }
                results.sort((a, b) => b.similarity - a.similarity);
                return results;
            }


            // ==================== PNG 工具函数 ====================
            const crcTable = (() => { let c; const table = []; for (let n = 0; n < 256; n++) { c = n; for (let k = 0; k < 8; k++) { c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); } table[n] = c >>> 0; } return table; })();
            function crc32(bytes) { let crc = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) { crc = (crc >>> 8) ^ crcTable[(crc ^ bytes[i]) & 0xFF]; } return (crc ^ 0xFFFFFFFF) >>> 0; }
            function uint32ToBytes(num) { return [num >>> 24, (num >>> 16) & 0xFF, (num >>> 8) & 0xFF, num & 0xFF]; }

            function removePNGMetadata(blob) {
                return new Promise(async (resolve, reject) => {

                        for (let i = 0; i < 8; i++)
                            if (bytes[i] !== signature[i]) { resolve(blob); return; }
                        const chunks = [];
                        let offset = 8;
                        while (offset < bytes.length) {
                            if (offset + 8 > bytes.length) break;
                            const length = (bytes[offset] << 24) | (bytes[offset + 1] << 16) | (bytes[offset + 2] << 8) | bytes[offset + 3];
                            const type = String.fromCharCode(bytes[offset + 4], bytes[offset + 5], bytes[offset + 6], bytes[offset + 7]);
                            const dataStart = offset + 8;
                            const dataEnd = dataStart + length;
                            if (dataEnd + 4 > bytes.length) break;
                            if (type !== 'tEXt' && type !== 'iTXt' && type !== 'zTXt') {
                                chunks.push(bytes.slice(offset, dataEnd + 4));
                            }
                            offset = dataEnd + 4;
                        }
                        const signatureBytes = bytes.slice(0, 8);
                        const totalLength = chunks.reduce((sum, c) => sum + c.length, 0) + 8;
                        const result = new Uint8Array(totalLength);
                        result.set(signatureBytes, 0);
                        let pos = 8;
                        for (const chunk of chunks) { result.set(chunk, pos); pos += chunk.length; }
                        resolve(new Blob([result], { type: 'image/png' }));
                    } catch (e) { reject(e); }
                });
            }
            
// 往 PNG 中注入 tEXt chunk 的工具函数 (已修复文件损坏与CRC覆盖问题)
function injectPNGMetadata(blob, metadataObj) {
    return new Promise(async (resolve, reject) => {
        try {
            const arrayBuffer = await blob.arrayBuffer();
            const bytes = new Uint8Array(arrayBuffer);

            const chunks = [];
            let offset = 8; // 跳过 PNG Signature
            while (offset < bytes.length) {
                if (offset + 8 > bytes.length) break;
                const length = (bytes[offset] << 24) | (bytes[offset + 1] << 16) | (bytes[offset + 2] << 8) | bytes[offset + 3];
                const dataEnd = offset + 8 + length;
                chunks.push(bytes.slice(offset, dataEnd + 4));
                offset = dataEnd + 4;
            }

            // 使用 Comment 关键字以完美兼容上方 parsePNGMetadata 的识别逻辑
            const keyword = 'Comment';
            const textContent = JSON.stringify(metadataObj);

            // tEXt chunk 的数据格式: Keyword + NULL + Text
            const textBytes = new TextEncoder().encode(keyword + '\0' + textContent);
            const chunkLength = textBytes.length;
            const chunkLengthBytes = uint32ToBytes(chunkLength);
            const chunkTypeBytes = new TextEncoder().encode('tEXt');

            // 计算 CRC 需要包含 Chunk Type (4字节) 和 Data
            const chunkData = new Uint8Array(4 + chunkLength);
            chunkData.set(chunkTypeBytes, 0);
            chunkData.set(textBytes, 4);
            const crc = crc32(chunkData);
            const crcBytes = uint32ToBytes(crc);

            // 组装新的 chunk：Length(4) + Type(4) + Data(chunkLength) + CRC(4) = 12 + chunkLength
            const newChunk = new Uint8Array(12 + chunkLength);
            newChunk.set(chunkLengthBytes, 0);
            newChunk.set(chunkData, 4);
            newChunk.set(crcBytes, 8 + chunkLength); // 修复: 原来少算了 Type 的 4 字节偏移量

            // 将新 chunk 插入到 signature 和原图像 chunk(如IHDR) 之间
            const signature = bytes.slice(0, 8);
            const resultChunks = [signature, chunks[0], newChunk, ...chunks.slice(1)];

            const totalLength = resultChunks.reduce((acc, c) => acc + c.length, 0);
            const resultBytes = new Uint8Array(totalLength);
            let pos = 0;
            for(const c of resultChunks) {
                resultBytes.set(c, pos);
                pos += c.length;
            }

            resolve(new Blob([resultBytes], { type: 'image/png' }));
        } catch(e) {
            reject(e);
        }
    });
}

// 降级为 8位色(256色) 纯净 PNG，然后注入元数据
function compressAndInjectPNG(imageObj, colors = 256) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(imageObj.fileBlob);

        img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');

            // 填充白底，丢弃透明通道带来的干扰
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);

            // 获取 RGBA 像素数据
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);

            try {
                // 使用 UPNG.js 将图像转化为 256 色索引 PNG
                const compressedArrayBuffer = UPNG.encode([imageData.data.buffer], canvas.width, canvas.height, colors);
                const compressedBlob = new Blob([compressedArrayBuffer], { type: 'image/png' });

                // NAI 元数据字段映射，uc是负向提示词的标准键名
                const metaDict = {
                    prompt: imageObj.prompt || '',
                    uc: imageObj.negativePrompt || '',
                    seed: imageObj.seed,
                    steps: imageObj.steps,
                    sampler: imageObj.sampler,
                    scale: imageObj.scale
                };

                // 注入修复好的元数据
                injectPNGMetadata(compressedBlob, metaDict).then(finalBlob => {
                    resolve(finalBlob);
                }).catch(e => {
                    console.error('元数据注入失败:', e);
                    resolve(compressedBlob);
                });

            } catch (e) {
                console.error('UPNG 压缩失败:', e);
                reject(e);
            }
        };

        img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error('图片加载失败'));
        };
        img.src = url;
    });
}

            function formatBytes(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];

            function generateThumbnailFromBlob(blob, maxSize = 300) {
                return new Promise((resolve, reject) => {
                    const url = URL.createObjectURL(blob);
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width;
                        let h = img.height;
                        if (w > maxSize || h > maxSize) {
                            const ratio = Math.min(maxSize / w, maxSize / h);
                            w = Math.round(w * ratio);
                            h = Math.round(h * ratio);
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        URL.revokeObjectURL(url);
                        resolve(canvas.toDataURL('image/webp', 0.8));
                    };
                    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('缩略图生成失败')); };
                    img.src = url;
                });
            }

                                if (weight !== undefined) {
                                    const actualWeight = img.promptWeights && img.promptWeights[token] !== undefined ? img.promptWeights[token] : 1.0;
                                    return Math.abs(actualWeight - weight) < 0.001;
                                }
                                return true;
                            } else if (type === 'negative') {
                                if (!img.negativeTokens.includes(token)) return false;
                                if (weight !== undefined) {
                                    const actualWeight = img.negativeWeights && img.negativeWeights[token] !== undefined ? img.negativeWeights[token] : 1.0;
                                    return Math.abs(actualWeight - weight) < 0.001;
                                }
                                return true;
                            } else {
                                if (img.promptTokens.includes(token) || img.negativeTokens.includes(token)) {
                                    if (weight !== undefined) {
                                        let matched = false;
                                        if (img.promptTokens.includes(token)) {
                                            const w = img.promptWeights?.[token] ?? 1.0;
                                            if (Math.abs(w - weight) < 0.001) matched = true;
                                        }
                                        if (!matched && img.negativeTokens.includes(token)) {
                                            const w = img.negativeWeights?.[token] ?? 1.0;
                                            if (Math.abs(w - weight) < 0.001) matched = true;
                                        }
                                        return matched;
                                    }

                                }

                if (selectedIds.size === 0) { showToast('请先选择图片', 'error'); return; }
                const imagesToDelete = allImages.filter(img => selectedIds.has(img.id));
                if (imagesToDelete.length === 0) return;
                if (!confirm(`确定删除选中的 ${imagesToDelete.length} 张图片吗？`)) return;
                const deletedIds = new Set();
                let deletedCount = 0;
                for (const img of imagesToDelete) {
                    try {
                        await dbDeleteImage(img.id);
                        selectedIds.delete(img.id);
                        deletedIds.add(img.id);
                        deletedCount++;
                    } catch (err) {
                        console.error(`删除 ${img.name} 失败:`, err);
                        showToast(`删除 ${img.name} 失败`, 'error');
                    }
                }
                allImages = allImages.filter(img => !deletedIds.has(img.id));
                applyFilters();
                updateTokenStats();
                updateTotalSizeDisplay();
                if (tokenSidebar.classList.contains('active')) renderTokenList();
                showToast(`已删除 ${deletedCount} 张图片`, deletedCount === imagesToDelete.length ? 'success' : 'error');
            }

                            ${img.scale !== null ? `<div class="param-item"><span class="param-key">Scale</span><span class="param-value">${img.scale}</span></div>` : ''}

            function closeDetail() { detailModal.classList.remove('active'); }

            function getDiffTokensWithBlock(imgA, imgB, field) {
                const blockedDiff = getBlockedTokensForDiff();
                const tokensA = (field === 'prompt' ? imgA.promptTokens : imgA.negativeTokens).filter(t => !blockedDiff.has(t));
                const tokensB = (field === 'prompt' ? imgB.promptTokens : imgB.negativeTokens).filter(t => !blockedDiff.has(t));
                return {
                    common: tokensA.filter(t => tokensB.includes(t)),
                    diffA: tokensA.filter(t => !tokensB.includes(t)),
                    diffB: tokensB.filter(t => !tokensA.includes(t)),
                };
            }

            function openDiffModal(imgA, imgB) {
                const posData = getDiffTokensWithBlock(imgA, imgB, 'prompt');
                const negData = getDiffTokensWithBlock(imgA, imgB, 'negative');
                const renderDiffTokenList = (tokens, type) => tokens.map(t => `<span class="diff-token ${type}">${t}${getTranslationHtml(t)}</span>`).join('') || '<span style="color:#aaa;">无</span>';
                diffModalBody.innerHTML = `
                    <div class="diff-container">
                        <div class="diff-card"><div class="diff-title">${imgA.name}</div><span class="section-label">正向独有</span><div class="diff-token-list">${renderDiffTokenList(posData.diffA, 'positive')}</div><span class="section-label">负向独有</span><div class="diff-token-list">${renderDiffTokenList(negData.diffA, 'negative')}</div></div>
                        <div class="diff-card"><div class="diff-title">${imgB.name}</div><span class="section-label">正向独有</span><div class="diff-token-list">${renderDiffTokenList(posData.diffB, 'positive')}</div><span class="section-label">负向独有</span><div class="diff-token-list">${renderDiffTokenList(negData.diffB, 'negative')}</div></div>
                    </div>
                    <div class="modal-section"><span class="section-label">共同正向词条</span><div class="diff-token-list">${renderDiffTokenList(posData.common, 'positive')}</div></div>
                    <div class="modal-section"><span class="section-label">共同负向词条</span><div class="diff-token-list">${renderDiffTokenList(negData.common, 'negative')}</div></div>
                `;
                diffModal.classList.add('active');
            }

            function closeDiffModal() { diffModal.classList.remove('active'); }

            function openWeightDiffModal(imgA, imgB) {
                const weightsA = { ...(imgA.promptWeights || {}), ...(imgA.negativeWeights || {}) };
                const weightsB = { ...(imgB.promptWeights || {}), ...(imgB.negativeWeights || {}) };
                const blockedDiff = getBlockedTokensForDiff();
                const allTokens = new Set([...Object.keys(weightsA), ...Object.keys(weightsB)]);
                const diffTokens = [];
                allTokens.forEach(token => {
                    if (blockedDiff.has(token)) return;
                    const wA = weightsA[token] !== undefined ? weightsA[token] : 1.0;
                    const wB = weightsB[token] !== undefined ? weightsB[token] : 1.0;
                    if (Math.abs(wA - wB) > 0.001) diffTokens.push({ token, wA, wB });
                });
                if (diffTokens.length === 0) { showToast('没有权重差异', 'info'); return; }
                weightDiffBody.innerHTML = `<div class="weight-diff-list">${diffTokens.map(d => `<div class="weight-diff-row"><span class="diff-token-name">${d.token}${getTranslationHtml(d.token)}</span><span class="diff-weight">${imgA.name}: <strong>${d.wA}</strong></span><span class="diff-weight">${imgB.name}: <strong>${d.wB}</strong></span></div>`).join('')}</div>`;
                weightDiffModal.classList.add('active');
            }

            function closeWeightDiffModal() { weightDiffModal.classList.remove('active'); }

            function updateTokenStats() {
                tokenStats = { positive: {}, negative: {} };
                allImages.forEach(img => {
                    img.promptTokens.forEach(token => { tokenStats.positive[token] = (tokenStats.positive[token] || 0) + 1; });
                    img.negativeTokens.forEach(token => { tokenStats.negative[token] = (tokenStats.negative[token] || 0) + 1; });
                });
            }

            // ==================== 标签筛选栏 ====================
            function renderTagFilterBar() {
                if (currentTokenTab === 'blocked') {
                    tagFilterBar.style.display = 'none';
                    return;
                }
                const customLabels = loadCustomLabels();
                const tokenLabels = loadTokenLabels();
                const stats = currentTokenTab === 'positive' ? tokenStats.positive : tokenStats.negative;
                let html = '';
                if (customLabels.length === 0) {
                    tagFilterBar.innerHTML = '<span style="font-size:11px;color:var(--text-secondary);padding:4px;">暂无标签，点击"管理标签"创建</span>';
                    return;
                }
                html += `<span class="tag-filter-capsule ${activeTagFilters.length === 0 ? 'active' : ''}" data-label="__all__"><i class="fa-solid fa-list"></i> 全部</span>`;
                customLabels.forEach(label => {
                    const count = Object.entries(tokenLabels).filter(([token, labels]) => labels.includes(label) && stats[token]).length;
                    const isActive = activeTagFilters.includes(label);
                    const color = getLabelColor(label);
                    html += `<span class="tag-filter-capsule ${isActive ? 'active' : ''}" data-label="${label}" style="${isActive ? '' : `border-color:${color}30;background:${color}15;color:${color};`}"><i class="fa-solid fa-tag" style="font-size:9px;"></i> ${label} <span class="tag-count">${count}</span></span>`;
                });
                tagFilterBar.innerHTML = html;
                tagFilterBar.style.display = 'flex';
                tagFilterBar.querySelectorAll('.tag-filter-capsule').forEach(cap => {
                    cap.addEventListener('click', () => {
                        const label = cap.dataset.label;
                        if (label === '__all__') {
                            activeTagFilters = [];
                        } else {
                            const idx = activeTagFilters.indexOf(label);
                            if (idx >= 0) activeTagFilters.splice(idx, 1);
                            else activeTagFilters.push(label);
                        }
                        renderTagFilterBar();
                        renderTokenList();
                    });
                });
            }

            // ==================== 屏蔽分组相关 ====================

            function getBlockedTokensByGroup(group) {
                const blockedTokens = loadBlockedTokens();
                const result = new Set();
                for (const [token, settings] of Object.entries(blockedTokens)) {
                    if (settings[group]) result.add(token);
                }
                return result;
            }


            function renderBlockGroupBar() {
                if (currentTokenTab !== 'blocked') {
                    blockGroupBar.style.display = 'none';
                    return;
                }
                const groups = [
                    { key: 'display', icon: 'fa-eye', label: '展示' },
                    { key: 'copy', icon: 'fa-copy', label: '复制' },
                    { key: 'diff', icon: 'fa-code-compare', label: '对比' }
                ];
                let html = '';
                groups.forEach(g => {
                    const count = getBlockedTokensByGroup(g.key).size;
                    const active = currentBlockGroup === g.key ? 'active' : '';
                    html += `<button class="block-group-btn ${active}" data-group="${g.key}"><i class="fa-solid ${g.icon} group-icon"></i> ${g.label} <span class="group-count">${count}</span></button>`;
                });
                blockGroupBar.innerHTML = html;
                blockGroupBar.style.display = 'flex';
                blockGroupBar.querySelectorAll('.block-group-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        currentBlockGroup = btn.dataset.group;
                        batchUnblockSelected.clear();
                        renderBlockGroupBar();
                        renderTokenList();
                        updateBatchUnblockUI();
                    });
                });
            }

            function renderBlockedTokenList() {
                if (currentTokenTab !== 'blocked') return;
                const searchTerm = tokenSearchInput.value.trim().toLowerCase();
                const tokenLabels = loadTokenLabels();
                const translations = loadTranslations();

                const groupedTokens = getBlockedTokensByGroup(currentBlockGroup);
                let entries = Array.from(groupedTokens).map(token => {
                    const type = tokenStats.positive[token] ? 'positive' : (tokenStats.negative[token] ? 'negative' : null);
                    return { token, type };
                }).filter(e => e.type !== null);

                if (searchTerm) {
                    entries = entries.filter(({ token }) => {
                        const trans = translations[token] || '';
                        return token.toLowerCase().includes(searchTerm) || trans.toLowerCase().includes(searchTerm) || (tokenLabels[token] || []).some(l => l.toLowerCase().includes(searchTerm));
                    });
                }

                if (entries.length === 0) {
                    tokenList.innerHTML = `<div style="text-align:center;padding:30px;color:var(--text-secondary);font-size:13px;"><i class="fa-solid fa-check-circle" style="font-size:30px;opacity:0.4;display:block;margin-bottom:10px;"></i>当前分组下没有被屏蔽的词条</div>`;
                    batchUnblockBar.classList.remove('active');
                    return;
                }

                tokenList.innerHTML = '';
                entries.forEach(({ token, type }) => {
                    const item = document.createElement('div');
                    item.className = 'token-item';
                    const count = type === 'positive' ? (tokenStats.positive[token] || 0) : (tokenStats.negative[token] || 0);
                    const countClass = type === 'positive' ? 'pos' : 'neg';
                    const labels = tokenLabels[token] || [];
                    const isSelected = batchUnblockSelected.has(token);

                    let labelsHtml = '';
                    if (labels.length > 0) {
                        labelsHtml = labels.slice(0, 2).map(l => {
                            const color = getLabelColor(l);
                            return `<span class="tag-badge" style="background:${color}15;color:${color};border:1px solid ${color}40;">${l}</span>`;
                        }).join('');
                    }

                    item.innerHTML = `
                        <input type="checkbox" class="token-checkbox show" data-token="${token}" ${isSelected ? 'checked' : ''}>
                        <span class="token-name" data-token="${token}"><i class="fa-solid ${type === 'positive' ? 'fa-plus-circle' : 'fa-minus-circle'}" style="font-size:12px;color:var(--text-secondary);"></i> ${token}${getTranslationHtml(token)}</span>
                        ${labelsHtml}
                        <span class="token-count ${countClass}">${count} 次</span>
                        <button class="token-action-btn unblock-btn" data-token="${token}" title="取消屏蔽"><i class="fa-solid fa-eye"></i></button>
                    `;

                    const checkbox = item.querySelector('.token-checkbox');
                    checkbox.addEventListener('change', (e) => {
                        e.stopPropagation();
                        const t = e.target.dataset.token;
                        if (e.target.checked) batchUnblockSelected.add(t);
                        else batchUnblockSelected.delete(t);
                        updateBatchUnblockUI();
                    });

                    item.querySelector('.token-name').addEventListener('click', () => {
                        currentTokenDetail = { token, type };
                        renderWeightBar(token, type);
                    });

                    item.querySelector('.unblock-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        unblockTokenFromGroup(token);
                    });

                    tokenList.appendChild(item);
                });

                batchUnblockBar.classList.add('active');
                updateBatchUnblockUI();
            }

            function unblockTokenFromGroup(token) {
                const blockedTokens = loadBlockedTokens();
                if (blockedTokens[token]) {
                    blockedTokens[token][currentBlockGroup] = false;
                    if (!blockedTokens[token].display && !blockedTokens[token].copy && !blockedTokens[token].diff) {
                        delete blockedTokens[token];
                    }
                    saveBlockedTokens(blockedTokens);
                }
                batchUnblockSelected.delete(token);
                renderBlockGroupBar();
                renderBlockedTokenList();
                showToast(`已取消 "${token}" 的 ${currentBlockGroup} 屏蔽`, 'success');
            }


function batchUnblockTokens() {
    if (batchUnblockSelected.size === 0) { showToast('请先选择词条', 'error'); return; }
    if (!confirm(`确定取消 ${batchUnblockSelected.size} 个词条的 "${currentBlockGroup}" 屏蔽吗？`)) return;
    const tokens = Array.from(batchUnblockSelected);
    const blockedTokens = loadBlockedTokens();

    tokens.forEach(token => {
        if (blockedTokens[token]) {
            blockedTokens[token][currentBlockGroup] = false;
            if (!blockedTokens[token].display && !blockedTokens[token].copy && !blockedTokens[token].diff) {
                delete blockedTokens[token];
            }
        }
    });
    saveBlockedTokens(blockedTokens);
    batchUnblockSelected.clear();
    renderBlockGroupBar();
    renderBlockedTokenList();
    showToast(`已批量取消 ${tokens.length} 个词条的屏蔽`, 'success');
}

            function updateBatchUnblockUI() {
                const count = batchUnblockSelected.size;
                batchUnblockCount.textContent = `已选 ${count} 项`;
                if (currentTokenTab === 'blocked') {
                    tokenList.querySelectorAll('.token-checkbox').forEach(cb => {
                        cb.checked = batchUnblockSelected.has(cb.dataset.token);
                    });
                }
            }

            // ==================== 词条列表渲染 ====================
function renderTokenList() {
    if (currentTokenTab === 'blocked') {
        renderBlockedTokenList();
        return;
    }
    blockGroupBar.style.display = 'none';
    batchUnblockBar.classList.remove('active');

    const searchTerm = tokenSearchInput.value.trim().toLowerCase();
    const stats = currentTokenTab === 'positive' ? tokenStats.positive : tokenStats.negative;
    const tokenLabels = loadTokenLabels();
    const translations = loadTranslations();
    let entries = Object.entries(stats).sort((a, b) => b[1] - a[1]);

    if (activeTagFilters.length > 0) {
        entries = entries.filter(([token]) => {
            const labels = tokenLabels[token] || [];
            return activeTagFilters.every(l => labels.includes(l));
        });
    }

    if (searchTerm) {
        entries = entries.filter(([token]) => {
            const labels = tokenLabels[token] || [];
            const trans = translations[token] || '';
            return token.toLowerCase().includes(searchTerm) || trans.toLowerCase().includes(searchTerm) || labels.some(l => l.toLowerCase().includes(searchTerm));
        });
    }

    if (!batchLabelMode) {
        entries = entries.filter(([token]) => {
            const settings = getEffectiveBlockSettings(token);
            return !settings.display;
        });
    }

    if (entries.length === 0) {
        tokenList.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-secondary);font-size:13px;"><i class="fa-solid fa-inbox" style="font-size:30px;opacity:0.4;display:block;margin-bottom:10px;"></i>暂无词条</div>';
        if (batchLabelMode) updateBatchSelectionUI();
        return;
    }
    tokenList.innerHTML = '';
    entries.forEach(([token, count]) => {
        const item = document.createElement('div');
        item.className = 'token-item';
        const countClass = currentTokenTab === 'positive' ? 'pos' : 'neg';
        const labels = tokenLabels[token] || [];
        const blockSettings = getEffectiveBlockSettings(token);
        const isBlockedDisplay = blockSettings.display;
        const isBlockedCopy = blockSettings.copy;
        const isBlockedDiff = blockSettings.diff;
        const isBatchSelected = batchSelectedTokens.has(token);
        const isCheckedInBatch = batchLabelMode && isBatchSelected;

        let labelsHtml = '';
        if (labels.length > 0) {
            const shownLabels = labels.slice(0, 2);
            const moreCount = labels.length - shownLabels.length;
            shownLabels.forEach(l => {
                const color = getLabelColor(l);
                labelsHtml += `<span class="tag-badge" data-label="${l}" title="点击筛选: ${l}" style="background:${color}15;color:${color};border:1px solid ${color}40;">${l}</span>`;
            });
            if (moreCount > 0) {
                labelsHtml += `<span class="tag-badge more-tags" title="${labels.join(', ')}">+${moreCount}</span>`;
            }
        }

        // 🚫 符号已移除，不再需要 blockIndicator 变量
        // const blockIndicator = (isBlockedDisplay || isBlockedCopy || isBlockedDiff) ?
        //     `<span title="已屏蔽: ${isBlockedDisplay?'展示 ':''}${isBlockedCopy?'复制 ':''}${isBlockedDiff?'差异':''}" style="font-size:10px;color:var(--danger);">🚫</span>` : '';

        item.innerHTML = `
            <input type="checkbox" class="token-checkbox ${batchLabelMode ? 'show' : ''}" data-token="${token}" ${isCheckedInBatch ? 'checked' : ''}>
            <span class="token-name" data-token="${token}">${token}${getTranslationHtml(token)}</span>
            ${labelsHtml}
            <span class="token-count ${countClass}">${count} 次</span>
            <button class="token-action-btn edit-trans-btn" data-token="${token}" title="编辑翻译"><i class="fa-solid fa-language"></i></button>
            <button class="token-action-btn tag-btn ${labels.length > 0 ? 'has-tag' : ''}" data-token="${token}" title="打标签"><i class="fa-solid fa-tag"></i></button>
            <button class="token-action-btn block-btn ${(isBlockedDisplay||isBlockedCopy||isBlockedDiff) ? 'blocked' : ''}" data-token="${token}" title="屏蔽设置"><i class="fa-solid fa-ban"></i></button>
            <button class="token-action-btn filter-token-btn" data-token="${token}" title="筛选图片"><i class="fa-solid fa-filter"></i></button>
        `;

        // ... 后续事件绑定代码保持不变 ...
        const nameEl = item.querySelector('.token-name');
        nameEl.addEventListener('click', () => {
            if (batchLabelMode) return;
            currentTokenDetail = { token, type: currentTokenTab };
            renderWeightBar(token, currentTokenTab);
        });

        const checkbox = item.querySelector('.token-checkbox');
        checkbox.addEventListener('change', (e) => {
            e.stopPropagation();
            const t = e.target.dataset.token;
            if (e.target.checked) batchSelectedTokens.add(t);
            else batchSelectedTokens.delete(t);
            updateBatchSelectionUI();
        });

        item.querySelector('.edit-trans-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            const curTrans = loadTranslations()[token] || '';
            const newTrans = prompt(`编辑 "${token}" 的翻译:`, curTrans);
            if (newTrans !== null) {
                const transData = loadTranslations();
                if (newTrans.trim()) {
                    transData[token] = newTrans.trim();
                } else {
                    delete transData[token];
                }
                saveTranslations(transData);
                renderTokenList();
            }
        });

        item.querySelector('.filter-token-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            addFilter({ token, type: currentTokenTab });
        });
        item.querySelector('.tag-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            openTagSelectorForToken(token);
        });
        item.querySelector('.block-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            openBlockSettingsForToken(token);
        });

        item.querySelectorAll('.tag-badge[data-label]').forEach(badge => {
            badge.addEventListener('click', (e) => {
                e.stopPropagation();
                const label = badge.dataset.label;
                if (!activeTagFilters.includes(label)) {
                    activeTagFilters.push(label);
                } else {
                    activeTagFilters = activeTagFilters.filter(l => l !== label);
                }
                renderTagFilterBar();
                renderTokenList();
            });
        });

        tokenList.appendChild(item);
    });
    if (batchLabelMode) updateBatchSelectionUI();
}

            function renderWeightBar(token, type) {
                if (!token) { tokenWeightBar.style.display = 'none'; return; }
                const weights = {};
                const images = allImages.filter(img => {
                    if (type === 'positive') return img.promptTokens.includes(token);
                    else return img.negativeTokens.includes(token);
                });
                images.forEach(img => {
                    const w = type === 'positive' ? (img.promptWeights?.[token] ?? 1.0) : (img.negativeWeights?.[token] ?? 1.0);
                    weights[w] = (weights[w] || 0) + 1;
                });
                const capsules = Object.entries(weights).sort((a, b) => parseFloat(a[0]) - parseFloat(b[0])).map(([weight, count]) => {
                    return `<span class="weight-capsule" data-weight="${weight}" data-token="${token}" data-type="${type}">${weight} <span class="weight-count">${count}</span></span>`;
                }).join('');
                tokenWeightBar.innerHTML = `<strong>${token} 权重使用率:</strong> ${capsules || '无权重数据'}`;
                tokenWeightBar.style.display = 'block';
                tokenWeightBar.querySelectorAll('.weight-capsule').forEach(cap => {
                    cap.addEventListener('click', () => {
                        const weight = parseFloat(cap.dataset.weight);
                        const token = cap.dataset.token;
                        const type = cap.dataset.type;
                        setWeightFilter(token, type, weight);
                    });
                });
            }

            function openTokenSidebar() {
                tokenSidebar.classList.add('active');
                updateTokenStats();
                renderTagFilterBar();
                renderBlockGroupBar();
                renderTokenList();
                if (currentTokenDetail) renderWeightBar(currentTokenDetail.token, currentTokenDetail.type);
            }

            function closeTokenSidebar() {
                tokenSidebar.classList.remove('active');
                if (batchLabelMode) toggleBatchLabelMode();
            }

            // ==================== 批量标注 ====================
            function toggleBatchLabelMode() {
                batchLabelMode = !batchLabelMode;
                batchSelectedTokens.clear();
                batchLabelBtn.classList.toggle('active', batchLabelMode);
                batchActionBar.classList.toggle('active', batchLabelMode);
                renderTokenList();
                if (batchLabelMode) {
                    showToast('批量标注模式已开启，请勾选词条', 'info');
                } else {
                    showToast('批量标注模式已关闭', 'info');
                }
            }

            // ==================== 标签管理模态框 ====================
             function openTagManager() {
                const customLabels = loadCustomLabels();
                const tokenLabels = loadTokenLabels();
                let selectedTagsForBatch = new Set();

                let html = '';
                if (customLabels.length === 0) {
                    html += '<div style="text-align:center;padding:20px;color:var(--text-secondary);font-size:13px;">暂无标签，请添加</div>';
                } else {
                    html += `

            // ==================== 批量屏蔽设置 ====================
function openBlockSettingsForBatch() {
    if (batchSelectedTokens.size === 0) {
        showToast('请先勾选词条', 'error');
        return;
    }
    
    const tokens = Array.from(batchSelectedTokens);
    const blockedTokens = loadBlockedTokens();
    
    // 检查当前这批词条中，哪些屏蔽维度已经被启用
    let hasDisplay = false, hasCopy = false, hasDiff = false;
    tokens.forEach(token => {
        const settings = blockedTokens[token] || {};
        if (settings.display) hasDisplay = true;
        if (settings.copy) hasCopy = true;
        if (settings.diff) hasDiff = true;
    });
    
    // 默认值：如果所有词条都已有某维度，则默认勾选；否则不勾选（取交集逻辑）
    // 更合理的做法：如果所有词条都有某维度则勾选，否则不勾选（批量应用时会覆盖所有）
    // 更简单：初始全部不勾选，让用户自行决定
    
    blockSettingsTitle.innerHTML = `<i class="fa-solid fa-ban"></i> 批量屏蔽 (${tokens.length} 个词条)`;
    blockSettingsBody.innerHTML = `
        <p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">为选中的 ${tokens.length} 个词条批量设置屏蔽维度（勾选即屏蔽）:</p>
        <div class="block-settings-row">
            <input type="checkbox" id="blockDisplayBatch" ${hasDisplay ? 'checked' : ''}>
            <div><span class="block-label">屏蔽展示</span><br><span class="block-desc">在词条库列表中隐藏该词条</span></div>
        </div>
        <div class="block-settings-row">
            <input type="checkbox" id="blockCopyBatch" ${hasCopy ? 'checked' : ''}>
            <div><span class="block-label">屏蔽复制</span><br><span class="block-desc">复制提示词时排除该词条</span></div>
        </div>
        <div class="block-settings-row">
            <input type="checkbox" id="blockDiffBatch" ${hasDiff ? 'checked' : ''}>
            <div><span class="block-label">屏蔽差异对比</span><br><span class="block-desc">在差异对比和相似度计算中忽略该词条</span></div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;">
            <button class="copy-btn" id="blockResetBatchBtn">重置</button>
            <button class="copy-btn positive-btn" id="blockSaveBatchBtn"><i class="fa-solid fa-check"></i> 确认屏蔽</button>
        </div>
    `;
    
    document.getElementById('blockResetBatchBtn').addEventListener('click', () => {
        document.getElementById('blockDisplayBatch').checked = false;
        document.getElementById('blockCopyBatch').checked = false;
        document.getElementById('blockDiffBatch').checked = false;
    });
    
    document.getElementById('blockSaveBatchBtn').addEventListener('click', () => {
        const display = document.getElementById('blockDisplayBatch').checked;
        const copy = document.getElementById('blockCopyBatch').checked;
        const diff = document.getElementById('blockDiffBatch').checked;
        
        if (!display && !copy && !diff) {
            if (!confirm('所有维度都未勾选，这将移除这些词条的所有屏蔽设置，确定吗？')) return;
        }
        
        const blocked = loadBlockedTokens();
        tokens.forEach(token => {
            if (display || copy || diff) {
                // 保留原有其他维度的设置，仅覆盖当前勾选的维度
                if (!blocked[token]) blocked[token] = { display: false, copy: false, diff: false };
                // 只修改用户勾选的维度，其他维度保持不变（更符合直觉）
                // 但如果用户明确取消勾选某个维度，也应该取消屏蔽
                // 更清晰的逻辑：将当前维度设置为用户勾选的值
                if (display !== undefined) blocked[token].display = display;
                if (copy !== undefined) blocked[token].copy = copy;
                if (diff !== undefined) blocked[token].diff = diff;
                // 如果所有维度都是 false，删除该条目
                if (!blocked[token].display && !blocked[token].copy && !blocked[token].diff) {
                    delete blocked[token];
                }
            } else {
                // 全部取消勾选 → 移除该词条的所有屏蔽设置
                delete blocked[token];
            }
        });
        saveBlockedTokens(blocked);
        
        blockSettingsModal.classList.remove('active');
        renderTokenList();
        renderBlockGroupBar();
        showToast(`已批量更新 ${tokens.length} 个词条的屏蔽设置`, 'success');
    });
    
    blockSettingsModal.classList.add('active');
}
